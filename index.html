<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ВПР · DeepSeek</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      color: #111;
      --border: #e0e0e0;
      --muted: #666;
    }
    body {
      max-width: 36rem;
      margin: 2rem auto;
      padding: 0 1.25rem 3rem;
    }
    h1 {
      font-size: 1.125rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0 0 1.5rem;
    }
    label.block {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin: 1.25rem 0 0.5rem;
    }
    .dropzone {
      display: block;
      position: relative;
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
      background: #fafafa;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .dropzone:hover { border-color: #bbb; background: #f5f5f5; }
    .dropzone--over {
      border-color: #888;
      background: #f0f0f0;
    }
    .dropzone-input {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .dropzone-visual { display: block; pointer-events: none; font-size: 0.9rem; }
    .dropzone-muted { font-size: 0.82rem; color: var(--muted); margin-top: 0.35rem; }
    .dropzone-link {
      pointer-events: auto;
      color: #0d47a1;
      text-decoration: underline;
      cursor: pointer;
    }
    .dropzone-status {
      margin-top: 0.5rem;
      font-size: 0.78rem;
      color: var(--muted);
      word-break: break-word;
    }
    input[type="password"],
    input[type="url"] {
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      padding: 0.5rem 0.65rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 0.9rem;
    }
    details.api-more {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    details.api-more summary {
      cursor: pointer;
      user-select: none;
    }
    details.api-more[open] summary { margin-bottom: 0.5rem; }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 1.5rem 0 0;
    }
    button {
      padding: 0.5rem 1rem;
      border-radius: 6px;
      border: none;
      background: #111;
      color: #fff;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button:hover { background: #333; }
    button.secondary {
      background: #fff;
      color: #111;
      border: 1px solid var(--border);
    }
    button.secondary:hover { background: #fafafa; }
    #log {
      white-space: pre-wrap;
      font-size: 0.8rem;
      color: #5c4a3a;
      margin: 1rem 0 0;
      min-height: 0;
    }
    .preview-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin: 1.25rem 0 0.5rem;
    }
    textarea#preview {
      width: 100%;
      min-height: 12rem;
      box-sizing: border-box;
      font-family: ui-monospace, monospace;
      font-size: 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      padding: 0.6rem;
      resize: vertical;
    }
    .footnote {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 1.75rem;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <h1>ВПР · DeepSeek</h1>

  <label class="block" for="tplFile">Образец HTML</label>
  <label class="dropzone" id="dropzoneTpl" data-dropzone="template">
    <input type="file" id="tplFile" class="dropzone-input" accept=".txt,.htm,.html,text/plain,text/html" />
    <span class="dropzone-visual">
      Перетащите файл или <span class="dropzone-link">выберите</span>
      <span class="dropzone-muted">.txt / .htm — структура для ИИ</span>
      <span class="dropzone-status" id="tplStatus">Встроенный образец</span>
    </span>
  </label>

  <label class="block" for="taskFiles">Задания</label>
  <label class="dropzone" id="dropzoneTasks" data-dropzone="tasks">
    <input type="file" id="taskFiles" class="dropzone-input" accept=".txt,.htm,.html,.zip,text/plain,text/html,application/zip" multiple />
    <span class="dropzone-visual">
      Файлы или <span class="dropzone-link">выбор</span> · при необходимости .zip
      <span class="dropzone-status" id="taskStatus">Не выбрано</span>
    </span>
  </label>

  <label class="block" for="deepseekKey">API-ключ</label>
  <input type="password" id="deepseekKey" autocomplete="off" placeholder="sk-…" />

  <details class="api-more">
    <summary>Базовый URL API</summary>
    <input type="url" id="deepseekBase" value="https://api.deepseek.com/v1" placeholder="https://api.deepseek.com/v1" />
  </details>

  <div class="actions">
    <button type="button" id="btnRun">Обработать</button>
    <button type="button" class="secondary" id="btnDownloadOne" hidden>Скачать</button>
    <button type="button" class="secondary" id="btnDownloadZip" hidden>ZIP</button>
  </div>

  <p id="log"></p>

  <label class="preview-label" for="preview">Вывод</label>
  <textarea id="preview" readonly rows="14" spellcheck="false"></textarea>

  <p class="footnote">Ключ хранится в localStorage браузера. При ошибке сети (CORS) откройте страницу через HTTPS или прокси к API.</p>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
